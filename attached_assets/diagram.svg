<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0F172A" />

  <!-- Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" stroke-dasharray="3,3">
    <line x1="50" y1="200" x2="450" y2="200" />
    <line x1="250" y1="50" x2="250" y2="350" />
  </g>

  <!-- Coordinate Axes -->
  <g stroke="#64748B" stroke-width="1.5">
    <line x1="30" y1="200" x2="470" y2="200" />
    <line x1="250" y1="30" x2="250" y2="370" />
  </g>

  <!-- Axes Labels -->
  <text x="460" y="190" fill="#64748B" font-family="sans-serif" font-size="12">x</text>
  <text x="260" y="45" fill="#64748B" font-family="sans-serif" font-size="12">y</text>
  <text x="235" y="215" fill="#64748B" font-family="sans-serif" font-size="12">O</text>

  <!-- Inner Ellipse C1 -->
  <ellipse cx="250" cy="200" rx="100" ry="75" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="5,5" />
  <text x="170" y="140" fill="#10B981" font-family="sans-serif" font-size="12" font-style="italic">C₁ (Locus of S)</text>

  <!-- Outer Trajectory Gamma -->
  <path d="M 110,200 C 110,105 170,75 250,75 C 330,75 390,105 390,200 C 390,295 330,325 250,325 C 170,325 110,295 110,200 Z" fill="none" stroke="#3B82F6" stroke-width="2.5" />
  <text x="360" y="280" fill="#3B82F6" font-family="sans-serif" font-size="12" font-weight="bold">Γ (Locus of Q)</text>

  <!-- Markers definition -->
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A855F7" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Vector S(t) from O to S -->
  <line x1="250" y1="200" x2="310" y2="140" stroke="#A855F7" stroke-width="2.5" marker-end="url(#arrow-purple)" />
  <circle cx="310" cy="140" r="4" fill="#A855F7" />
  <text x="318" y="148" fill="#A855F7" font-family="sans-serif" font-size="12" font-weight="bold">S(t)</text>
  <text x="270" y="185" fill="#A855F7" font-family="sans-serif" font-size="11">S⃗(t)</text>

  <!-- Vector u(t) from S to Q -->
  <line x1="310" y1="140" x2="267.6" y2="97.6" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <circle cx="267.6" cy="97.6" r="4" fill="#EF4444" />
  <text x="245" y="92" fill="#EF4444" font-family="sans-serif" font-size="12" font-weight="bold">Q(t)</text>
  <text x="295" y="115" fill="#EF4444" font-family="sans-serif" font-size="11">u⃗(t)</text>

  <!-- Vector r_Q(t) from O to Q (dashed) -->
  <line x1="250" y1="200" x2="267.6" y2="97.6" stroke="#F59E0B" stroke-dasharray="3,3" stroke-width="1.5" />
  <text x="235" y="150" fill="#F59E0B" font-family="sans-serif" font-size="11">r⃗_Q(t)</text>

  <!-- Right Angle Symbol at S -->
  <path d="M 302.9,132.9 L 295.8,140 L 302.9,147.1" fill="none" stroke="#E2E8F0" stroke-width="1" />
</svg>
